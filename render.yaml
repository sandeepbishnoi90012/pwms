# Render Blueprint: deploys the backend API (web service) and the frontend (static site).
# The database is NOT created here - use TiDB Cloud (free MySQL) and paste its connection details
# into the values marked "sync: false" when Render asks for them.
services:
  # ---------- Backend: Node/Express REST API ----------
  - type: web
    name: pwms-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DB_HOST            # TiDB Cloud host, e.g. gateway01.ap-southeast-1.prod.aws.tidbcloud.com
        sync: false
      - key: DB_PORT            # 4000 for TiDB Cloud
        value: "4000"
      - key: DB_USER            # e.g. 2abcDEF.root
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME            # database to use (it is created automatically if permitted), e.g. pwms
        value: pwms
      - key: DB_SSL             # TiDB Cloud requires TLS
        value: "true"
      - key: JWT_SECRET         # random secret generated by Render
        generateValue: true
      - key: FRONTEND_ORIGIN    # URL of the frontend below, e.g. https://pwms-frontend.onrender.com (no trailing slash)
        sync: false

  # ---------- Frontend: React static site ----------
  - type: web
    name: pwms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: public
    envVars:
      - key: PWMS_API           # URL of the backend above, e.g. https://pwms-backend.onrender.com/api
        sync: false
